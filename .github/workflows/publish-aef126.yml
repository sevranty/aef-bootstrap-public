name: Publish AEF126 bootstrap v3

on:
  push:
    branches:
      - publish/aef-126-bootstrap-v3
    paths:
      - .github/workflows/publish-aef126.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Materialize exact validated artifact
        env:
          ARTIFACT_URL: https://sdmntpritalynorth.oaiusercontent.com/files/00000000-acf8-8246-a3d6-446223663b02/raw?se=2026-08-15T23%3A38%3A11Z&sp=r&sv=2026-02-06&sr=b&scid=d1d8f5cd-795d-5668-bd21-154e67c36e6c&skoid=d4d17077-8f33-42a9-bd8b-aa9d5eaf5320&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-15T21%3A51%3A37Z&ske=2026-08-16T21%3A51%3A37Z&sks=b&skv=2026-02-06&sig=HJm1UNjXA1y0HE35ViBCETMsjiucg96hJ4cOHVe5bGE%3D
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "$ARTIFACT_URL" --output "$RUNNER_TEMP/aef126.zip"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import zipfile

          archive = Path(os.environ["RUNNER_TEMP"]) / "aef126.zip"
          expected = {
              "aef-worker-v3.yaml": (81936, "ac1ee32fb5fa1b50a2a4fc5858bb149410580ddd73a6b1a6ff5252a251d6e2a8"),
              "aef-worker-v3-manifest.json": (784, "c27753fa5fdadafa43ddac749c23bea95fd00ee496c4fe3ed13888b87ecc6157"),
          }
          with zipfile.ZipFile(archive) as zf:
              names = set(zf.namelist())
              if names != set(expected):
                  raise SystemExit(f"unexpected artifact members: {sorted(names)}")
              for name, (size, digest) in expected.items():
                  data = zf.read(name)
                  actual = hashlib.sha256(data).hexdigest()
                  if len(data) != size or actual != digest:
                      raise SystemExit(f"artifact mismatch: {name} {len(data)} {actual}")
                  Path(name).write_bytes(data)
          yaml_data = Path("aef-worker-v3.yaml").read_bytes()
          manifest = json.loads(Path("aef-worker-v3-manifest.json").read_text(encoding="ascii"))
          if not yaml_data.startswith(b"#cloud-config\n"):
              raise SystemExit("bootstrap is not cloud-config")
          if manifest.get("credential_values_present") is not False or manifest.get("activation_performed") is not False:
              raise SystemExit("secret-free/non-activation boundary failed")
          if manifest.get("remote_cloud_config_bytes") != len(yaml_data):
              raise SystemExit("manifest byte-count mismatch")
          if manifest.get("remote_cloud_config_sha256") != hashlib.sha256(yaml_data).hexdigest():
              raise SystemExit("manifest sha mismatch")
          print("AEF126_PUBLICATION_BYTES_PASS")
          PY

      - name: Commit exact distribution bytes
        run: |
          set -euo pipefail
          rm .github/workflows/publish-aef126.yml
          git add aef-worker-v3.yaml aef-worker-v3-manifest.json
          git add -A .github/workflows/publish-aef126.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "AEF#126 publish exact bootstrap v3 distribution"
          git push origin HEAD:publish/aef-126-bootstrap-v3
