name: AEF-PUBLIC#7 import v5

on:
  push:
    branches:
      - publish/aef-public-7-v5
    paths:
      - .github/workflows/aef-public-7-import-v5.yml

permissions:
  contents: write

jobs:
  import-v5:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Download exact AEF main CI artifact
        env:
          SOURCE_URL: 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-c278-820a-9ddf-8198047c5a42/raw?se=2026-08-16T12%3A53%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=e887be5b-f7e0-544a-b79a-e002310d6861&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-15T22%3A37%3A37Z&ske=2026-08-16T22%3A37%3A37Z&sks=b&skv=2026-02-06&sig=0el9oS/iYcw/f3Cksh59vzRBU0VaJOjKtlg9xHmo5Jg%3D'
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "$SOURCE_URL" --output "$RUNNER_TEMP/aef167-v5.zip"
          printf '%s  %s\n' 'd5c0702baba5637bb84c9dd4bfaac167f74350c99497ab317101e128115ac716' "$RUNNER_TEMP/aef167-v5.zip" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/aef167-v5"
          unzip -q "$RUNNER_TEMP/aef167-v5.zip" -d "$RUNNER_TEMP/aef167-v5"

      - name: Verify exact public bytes before copy
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'aef167-v5'
          expected = {
              'aef-worker-v5.yaml': (125666, '7ab08496444bca789a681519700e8ffe477282e99c69b1c1df172521f2ca6095'),
              'aef-worker-v5-manifest.json': (1429, '8a91db7a84d9417821dc906b8a00e8c3411c6953d1234618203011729e455a40'),
          }
          if {p.name for p in root.iterdir()} != set(expected):
              raise SystemExit('unexpected artifact file set')
          for name, (size, digest) in expected.items():
              data = (root / name).read_bytes()
              if len(data) != size or hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit(f'identity mismatch: {name}')
              for marker in (
                  b'-----BEGIN OPENSSH PRIVATE KEY-----',
                  b'-----BEGIN PRIVATE KEY-----',
                  b'github_pat_', b'ghp_', b'gho_', b'ghu_', b'ghs_', b'ghr_'
              ):
                  if marker in data:
                      raise SystemExit(f'forbidden credential marker in {name}')
          manifest = json.loads((root / 'aef-worker-v5-manifest.json').read_text(encoding='ascii'))
          yaml_bytes = (root / 'aef-worker-v5.yaml').read_bytes()
          if manifest['remote_cloud_config_bytes'] != len(yaml_bytes):
              raise SystemExit('manifest byte mismatch')
          if manifest['remote_cloud_config_sha256'] != hashlib.sha256(yaml_bytes).hexdigest():
              raise SystemExit('manifest SHA mismatch')
          if manifest['credential_values_present'] is not False or manifest['activation_performed'] is not False:
              raise SystemExit('unsafe distribution state')
          if manifest['github_cli_asset_sha256'] != 'a2c9b8497e1f85b1ad0dfcb78b5a622e098801b8e461e459e88e1ee12f018112':
              raise SystemExit('GitHub CLI asset drift')
          PY

      - name: Commit only exact v5 distribution bytes
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/aef167-v5/aef-worker-v5.yaml" ./aef-worker-v5.yaml
          cp "$RUNNER_TEMP/aef167-v5/aef-worker-v5-manifest.json" ./aef-worker-v5-manifest.json
          printf '%s  %s\n' '7ab08496444bca789a681519700e8ffe477282e99c69b1c1df172521f2ca6095' aef-worker-v5.yaml | sha256sum --check --strict
          printf '%s  %s\n' '8a91db7a84d9417821dc906b8a00e8c3411c6953d1234618203011729e455a40' aef-worker-v5-manifest.json | sha256sum --check --strict
          git config user.name 'sevranty'
          git config user.email '4818162+sevranty@users.noreply.github.com'
          git add -- aef-worker-v5.yaml aef-worker-v5-manifest.json
          git diff --cached --check
          git commit -m 'AEF-PUBLIC#7 import exact clean-bootstrap v5 bytes'
          git push origin HEAD:publish/aef-public-7-v5
