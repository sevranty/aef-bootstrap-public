name: Validate public AEF bootstrap

on:
  pull_request:
    branches:
      - main
    paths:
      - aef-worker-v3.yaml
      - aef-worker-v3-manifest.json
      - aef-worker-v4.yaml
      - aef-worker-v4-manifest.json
      - aef-worker-v5.yaml
      - aef-worker-v5-manifest.json
      - aef207-rep191-shadow-live.py
      - aef207-rep191-shadow-live-manifest.json
      - aef207-rep191-shadow-live-v2.py
      - aef207-rep191-shadow-live-v2-manifest.json
      - README.md
      - .github/workflows/validate-bootstrap.yml
  push:
    branches:
      - main
    paths:
      - aef-worker-v3.yaml
      - aef-worker-v3-manifest.json
      - aef-worker-v4.yaml
      - aef-worker-v4-manifest.json
      - aef-worker-v5.yaml
      - aef-worker-v5-manifest.json
      - aef207-rep191-shadow-live.py
      - aef207-rep191-shadow-live-manifest.json
      - aef207-rep191-shadow-live-v2.py
      - aef207-rep191-shadow-live-v2-manifest.json
      - README.md
      - .github/workflows/validate-bootstrap.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify public distribution contracts
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          forbidden = (
              b"-----BEGIN OPENSSH PRIVATE KEY-----",
              b"-----BEGIN PRIVATE KEY-----",
              b"github_pat_",
              b"ghp_",
              b"gho_",
              b"ghu_",
              b"ghs_",
              b"ghr_",
          )

          def verify(version, required, expected):
              yaml_path = Path(f"aef-worker-{version}.yaml")
              manifest_path = Path(f"aef-worker-{version}-manifest.json")
              data = yaml_path.read_bytes()
              manifest_bytes = manifest_path.read_bytes()
              manifest = json.loads(manifest_bytes.decode("ascii"))

              for key, value in required.items():
                  if manifest.get(key) != value:
                      raise SystemExit(f"{version} manifest contract mismatch: {key}")

              data_sha = hashlib.sha256(data).hexdigest()
              manifest_sha = hashlib.sha256(manifest_bytes).hexdigest()
              if len(data) != manifest.get("remote_cloud_config_bytes"):
                  raise SystemExit(f"{version} bootstrap byte-count mismatch")
              if data_sha != manifest.get("remote_cloud_config_sha256"):
                  raise SystemExit(f"{version} bootstrap SHA-256 mismatch")
              if len(data) != expected["yaml_bytes"] or data_sha != expected["yaml_sha256"]:
                  raise SystemExit(f"{version} canonical bootstrap identity mismatch")
              if len(manifest_bytes) != expected["manifest_bytes"] or manifest_sha != expected["manifest_sha256"]:
                  raise SystemExit(f"{version} canonical manifest identity mismatch")
              if not data.startswith(b"#cloud-config\n"):
                  raise SystemExit(f"{version} bootstrap is not cloud-config")

              for marker in forbidden:
                  if marker in data or marker in manifest_bytes:
                      raise SystemExit(f"{version} forbidden credential marker: {marker!r}")

              print(
                  f"PUBLIC_BOOTSTRAP_{version.upper()}_PASS "
                  f"bytes={len(data)} sha256={data_sha} "
                  f"manifest_bytes={len(manifest_bytes)} manifest_sha256={manifest_sha}"
              )

          verify(
              "v3",
              {
                  "schema_version": 3,
                  "profile_id": "digitalocean-remote-cloud-config-v3",
                  "bootstrap_version": 3,
                  "provider": "digitalocean",
                  "provider_image_slug": "ubuntu-24-04-x64",
                  "format": "remote-cloud-config",
                  "credential_values_present": False,
                  "activation_performed": False,
              },
              {
                  "yaml_bytes": 81936,
                  "yaml_sha256": "ac1ee32fb5fa1b50a2a4fc5858bb149410580ddd73a6b1a6ff5252a251d6e2a8",
                  "manifest_bytes": 784,
                  "manifest_sha256": "c27753fa5fdadafa43ddac749c23bea95fd00ee496c4fe3ed13888b87ecc6157",
              },
          )

          verify(
              "v4",
              {
                  "schema_version": 4,
                  "profile_id": "digitalocean-remote-cloud-config-v4",
                  "bootstrap_driver_version": 4,
                  "runtime_core_version": 3,
                  "root_mode_acceptance_required": True,
                  "historical_failure_corpus_required": True,
                  "provider": "digitalocean",
                  "provider_image_slug": "ubuntu-24-04-x64",
                  "format": "remote-cloud-config",
                  "credential_values_present": False,
                  "activation_performed": False,
              },
              {
                  "yaml_bytes": 100695,
                  "yaml_sha256": "b8be3e80dfcd840a0aaf50d1b6d377dec857a77d0ce942718fcb2d9ba20a487c",
                  "manifest_bytes": 1031,
                  "manifest_sha256": "b99ac0759f538897a2cabeb757b7b8dafe472f2e14d48113069e9a42cb0026da",
              },
          )

          verify(
              "v5",
              {
                  "schema_version": 5,
                  "profile_id": "digitalocean-remote-cloud-config-v5",
                  "bootstrap_driver_version": 5,
                  "runtime_core_version": 3,
                  "root_mode_acceptance_required": True,
                  "historical_failure_corpus_required": True,
                  "provider": "digitalocean",
                  "provider_image_slug": "ubuntu-24-04-x64",
                  "format": "remote-cloud-config",
                  "release_archive_sha256": "a1eee6efa50b367d7ef2ffade4833fbf2b670c9b6476a7173d0679de663a33ce",
                  "github_cli_version": "2.97.0",
                  "github_cli_asset_bytes": 14770812,
                  "github_cli_asset_sha256": "a2c9b8497e1f85b1ad0dfcb78b5a622e098801b8e461e459e88e1ee12f018112",
                  "capabilities_required": ["github-api"],
                  "network_required_during_bootstrap": True,
                  "credential_values_present": False,
                  "activation_performed": False,
              },
              {
                  "yaml_bytes": 125666,
                  "yaml_sha256": "7ab08496444bca789a681519700e8ffe477282e99c69b1c1df172521f2ca6095",
                  "manifest_bytes": 1429,
                  "manifest_sha256": "8a91db7a84d9417821dc906b8a00e8c3411c6953d1234618203011729e455a40",
              },
          )

          actuator_path = Path("aef207-rep191-shadow-live.py")
          actuator = actuator_path.read_bytes()
          actuator_manifest_bytes = Path("aef207-rep191-shadow-live-manifest.json").read_bytes()
          actuator_manifest = json.loads(actuator_manifest_bytes.decode("ascii"))
          expected_actuator = {
              "schema_version": 1,
              "task_id": "AEF-PUBLIC#9",
              "parent_task_id": "AEF#207",
              "decision_id": "AEF61-REP191-PROTECTED-SHADOW-V1",
              "distribution_kind": "one-shot-shadow-live-actuator",
              "source_repository": "https://github.com/sevranty/agent-execution-fabric",
              "source_revision": "b93716bce237de73b46168c3c29d6e797a468dd7",
              "source_path": "control/aef61_rep191_shadow_live.py",
              "source_git_blob_sha": "4a05e0be9632c7f726b6ad3080f4e1bb16606e88",
              "actuator_path": "aef207-rep191-shadow-live.py",
              "actuator_sha256": "489d44e8d1861b123b21e87baf2377e26d62ca2909fb4fed33722661295a6845",
              "target_worker_id": "digitalocean:592813728",
              "credential_values_present": False,
              "activation_performed": False,
          }
          if actuator_manifest != expected_actuator:
              raise SystemExit("AEF#207 public actuator manifest contract mismatch")
          actuator_sha = hashlib.sha256(actuator).hexdigest()
          if actuator_sha != expected_actuator["actuator_sha256"]:
              raise SystemExit("AEF#207 public actuator SHA-256 mismatch")
          git_blob = hashlib.sha1(
              b"blob " + str(len(actuator)).encode("ascii") + b"\0" + actuator
          ).hexdigest()
          if git_blob != expected_actuator["source_git_blob_sha"]:
              raise SystemExit("AEF#207 public actuator Git blob mismatch")
          compile(actuator, "aef207-rep191-shadow-live.py", "exec")
          for marker in forbidden:
              if marker in actuator or marker in actuator_manifest_bytes:
                  raise SystemExit(f"AEF#207 forbidden credential marker: {marker!r}")
          print(
              "PUBLIC_AEF207_LIVE_ACTUATOR_PASS "
              f"bytes={len(actuator)} sha256={actuator_sha} git_blob={git_blob}"
          )

          actuator_v2_path = Path("aef207-rep191-shadow-live-v2.py")
          actuator_v2 = actuator_v2_path.read_bytes()
          actuator_v2_sha = hashlib.sha256(actuator_v2).hexdigest()
          actuator_v2_git_blob = hashlib.sha1(
              b"blob " + str(len(actuator_v2)).encode("ascii") + b"\0" + actuator_v2
          ).hexdigest()
          if actuator_v2_git_blob != "56419c35dbbddd216f47ef650ef9013b693abc67":
              raise SystemExit("AEF#207 v2 staged Git blob mismatch")
          compile(actuator_v2, "aef207-rep191-shadow-live-v2.py", "exec")
          for marker in forbidden:
              if marker in actuator_v2:
                  raise SystemExit(f"AEF#207 v2 forbidden credential marker: {marker!r}")
          print(
              "PUBLIC_AEF207_LIVE_ACTUATOR_V2_STAGED "
              f"bytes={len(actuator_v2)} sha256={actuator_v2_sha} git_blob={actuator_v2_git_blob}"
          )
          PY