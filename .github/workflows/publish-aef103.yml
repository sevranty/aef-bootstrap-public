name: Publish AEF103 bootstrap v3

on:
  push:
    branches:
      - publish/aef-103-bootstrap-v3
    paths:
      - .github/workflows/publish-aef103.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Materialize exact validated artifact
        env:
          ARTIFACT_URL: https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-bfe4-820a-87e7-d225b5c980dd/raw?se=2026-08-15T23%3A09%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=cad10387-0e3b-5d50-9898-33f1e9aeef2d&skoid=e5f84a89-964a-4fd3-92c2-c2cb3a12ea16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-15T22%3A29%3A55Z&ske=2026-08-16T22%3A29%3A55Z&sks=b&skv=2026-02-06&sig=wA7felWMbvHWi5Vxjod9qon0KnWlrPk1sJi%2B487amx0%3D
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "$ARTIFACT_URL" --output "$RUNNER_TEMP/aef103.zip"
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import zipfile

          archive = Path(os.environ["RUNNER_TEMP"]) / "aef103.zip"
          expected = {
              "aef-worker-v3.yaml": (80900, "6c052d8122fad68fa234147078d7fc640bff307cc261282fb7e39c182d00bb53"),
              "aef-worker-v3-manifest.json": (784, "8ff5722d35f89c58f0c57d68ab52a25b1d376c9ab3967d5781f1c682a8baeb49"),
          }
          with zipfile.ZipFile(archive) as zf:
              names = set(zf.namelist())
              if names != set(expected):
                  raise SystemExit(f"unexpected artifact members: {sorted(names)}")
              for name, (size, digest) in expected.items():
                  data = zf.read(name)
                  actual = hashlib.sha256(data).hexdigest()
                  if len(data) != size or actual != digest:
                      raise SystemExit(f"artifact mismatch: {name} {len(data)} {actual}")
                  Path(name).write_bytes(data)
          if not Path("aef-worker-v3.yaml").read_bytes().startswith(b"#cloud-config\n"):
              raise SystemExit("bootstrap is not cloud-config")
          print("AEF103_PUBLICATION_BYTES_PASS")
          PY

      - name: Commit exact distribution bytes
        run: |
          set -euo pipefail
          rm .github/workflows/publish-aef103.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git diff --cached --check -- README.md aef-worker-v3-manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "AEF#103 publish exact bootstrap v3 distribution"
          git push origin HEAD:publish/aef-103-bootstrap-v3
