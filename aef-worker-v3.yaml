#cloud-config
package_update: false
package_upgrade: false
write_files:
- path: /usr/local/sbin/aef-bootstrap-v3.py
  permissions: '0555'
  owner: root:root
  content: |
    #!/usr/bin/env python3
    """AEF v3 clean-host bootstrap runtime for Ubuntu 24.04."""
    from __future__ import annotations
    
    import base64
    import hashlib
    import io
    import json
    import os
    from pathlib import Path, PurePosixPath
    import pwd
    import shutil
    import stat
    import subprocess
    import sys
    import tarfile
    
    BOOTSTRAP_VERSION = 3
    ROOT = Path("/")
    MANIFEST_PATH = "/etc/aef/bootstrap-manifest-v3.json"
    PAYLOAD_PATH = "/opt/aef-release-v3.b85"
    STATE_PATH = "/etc/aef/bootstrap-state.json"
    RELEASES_PATH = "/opt/aef/releases"
    CURRENT_PATH = "/opt/aef/current"
    SWAP_PATH = "/swapfile"
    SWAP_BYTES = 1024 * 1024 * 1024
    DISK_HEADROOM_BYTES = 512 * 1024 * 1024
    TOP_LEVEL = "aef-release"
    MAX_ARCHIVE_BYTES = 64 * 1024 * 1024
    MANIFEST_KEYS = {
        "schema_version", "bootstrap_version", "release_sha256", "release_bytes",
        "inventory_sha256", "file_count", "files",
    }
    FILE_KEYS = {"path", "bytes", "mode", "sha256"}
    phase = "INIT"
    
    
    class BootstrapBlocked(RuntimeError):
        pass
    
    
    def rp(value: str) -> Path:
        if not value.startswith("/"):
            raise BootstrapBlocked("ABSOLUTE_PATH_REQUIRED")
        return ROOT / value.lstrip("/")
    
    
    def fail(code: str, detail: str = "") -> None:
        raise BootstrapBlocked(code + (":" + str(detail)[:240] if detail else ""))
    
    
    def _json_bytes(value) -> bytes:
        return (json.dumps(value, ensure_ascii=True, sort_keys=True, separators=(",", ":")) + "\n").encode("ascii")
    
    
    def atomic_json(path: Path, value) -> None:
        if path.parent.is_symlink():
            fail("STATE_PARENT_SYMLINK")
        path.parent.mkdir(parents=True, exist_ok=True)
        tmp = path.with_name(path.name + ".tmp")
        if tmp.exists() or tmp.is_symlink():
            tmp.unlink()
        flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL | getattr(os, "O_NOFOLLOW", 0)
        fd = os.open(tmp, flags, 0o444)
        try:
            data = _json_bytes(value)
            os.write(fd, data)
            os.fsync(fd)
        finally:
            os.close(fd)
        os.replace(tmp, path)
    
    
    def run_exact(candidates, *args, timeout=30, capture=False) -> str:
        executable = None
        for raw in candidates:
            path = Path(raw)
            try:
                resolved = path.resolve(strict=True)
            except OSError:
                continue
            if resolved.is_file() and os.access(resolved, os.X_OK):
                executable = str(resolved)
                break
        if executable is None:
            fail("BASE_EXECUTABLE_MISSING", "|".join(candidates))
        result = subprocess.run(
            [executable, *args],
            stdin=subprocess.DEVNULL,
            stdout=subprocess.PIPE if capture else subprocess.DEVNULL,
            stderr=subprocess.STDOUT if capture else subprocess.DEVNULL,
            text=True,
            timeout=timeout,
            check=False,
            env={"PATH": "/usr/bin:/bin:/usr/sbin:/sbin", "HOME": "/root"},
        )
        if result.returncode != 0:
            fail("BASE_COMMAND_FAILED", Path(executable).name)
        return result.stdout if capture else ""
    
    
    def systemd_version() -> str:
        output = run_exact(("/usr/bin/systemctl", "/bin/systemctl"), "--version", timeout=5, capture=True)
        return output.splitlines()[0] if output.splitlines() else "unknown"
    
    
    def swap_active() -> bool:
        try:
            rows = rp("/proc/swaps").read_text(encoding="utf-8").splitlines()[1:]
        except OSError:
            return False
        return any(row.split() and row.split()[0] == SWAP_PATH for row in rows)
    
    
    def service_installed() -> bool:
        return any(
            path.exists() or path.is_symlink()
            for path in (
                rp("/etc/systemd/system/aef-worker.service"),
                rp("/usr/lib/systemd/system/aef-worker.service"),
                rp("/lib/systemd/system/aef-worker.service"),
            )
        )
    
    
    def state(status: str, manifest=None, error=None, detail=None) -> None:
        atomic_json(
            rp(STATE_PATH),
            {
                "schema_version": 1,
                "bootstrap_version": BOOTSTRAP_VERSION,
                "status": status,
                "phase": phase,
                "release_sha256": manifest.get("release_sha256") if isinstance(manifest, dict) else None,
                "swap_bytes": SWAP_BYTES,
                "swap_active": swap_active(),
                "python": sys.version.split()[0],
                "systemd": systemd_version(),
                "service_installed": service_installed(),
                "service_enabled": False,
                "worker_enrolled": False,
                "dispatch_enabled": False,
                "failure_class": error,
                "failure_detail": detail,
            },
        )
    
    
    def mark(name: str, manifest=None) -> None:
        global phase
        phase = name
        state("RUNNING", manifest)
    
    
    def _os_release_path() -> Path:
        etc_path = rp("/etc/os-release")
        usr_path = rp("/usr/lib/os-release")
        try:
            etc_observed = os.lstat(etc_path)
        except OSError:
            fail("OS_RELEASE_INVALID")
        if stat.S_ISLNK(etc_observed.st_mode):
            try:
                resolved = etc_path.resolve(strict=True)
                expected = usr_path.resolve(strict=True)
            except OSError:
                fail("OS_RELEASE_INVALID")
            if resolved != expected:
                fail("OS_RELEASE_SYMLINK_TARGET_INVALID", str(resolved))
            path = expected
        elif stat.S_ISREG(etc_observed.st_mode):
            path = etc_path
        else:
            fail("OS_RELEASE_INVALID")
        try:
            observed = os.lstat(path)
        except OSError:
            fail("OS_RELEASE_INVALID")
        if not stat.S_ISREG(observed.st_mode) or stat.S_ISLNK(observed.st_mode):
            fail("OS_RELEASE_TARGET_INVALID")
        if stat.S_IMODE(observed.st_mode) & 0o022:
            fail("OS_RELEASE_TARGET_WRITABLE")
        return path
    
    
    def verify_os() -> None:
        path = _os_release_path()
        values = {}
        for line in path.read_text(encoding="utf-8").splitlines():
            if "=" in line:
                key, value = line.split("=", 1)
                values[key] = value.strip().strip('"')
        if values.get("ID") != "ubuntu" or values.get("VERSION_ID") != "24.04":
            fail("OS_CONTRACT_MISMATCH", values.get("PRETTY_NAME", "unknown"))
        if sys.version_info[:2] != (3, 12):
            fail("PYTHON_CONTRACT_MISMATCH", sys.version.split()[0])
    
    
    def load_manifest() -> dict:
        path = rp(MANIFEST_PATH)
        if path.is_symlink() or not path.is_file():
            fail("MANIFEST_INVALID")
        try:
            value = json.loads(path.read_text(encoding="ascii"))
        except (OSError, UnicodeDecodeError, json.JSONDecodeError):
            fail("MANIFEST_UNREADABLE")
        if not isinstance(value, dict) or set(value) != MANIFEST_KEYS:
            fail("MANIFEST_FIELDS_INVALID")
        if value.get("schema_version") != 1 or value.get("bootstrap_version") != BOOTSTRAP_VERSION:
            fail("MANIFEST_IDENTITY_INVALID")
        files = value.get("files")
        if not isinstance(files, list) or value.get("file_count") != len(files) or not files:
            fail("MANIFEST_FILESET_INVALID")
        seen = set()
        for record in files:
            if not isinstance(record, dict) or set(record) != FILE_KEYS:
                fail("MANIFEST_FILE_INVALID")
            path_text = record.get("path")
            digest = record.get("sha256")
            pure = PurePosixPath(path_text) if isinstance(path_text, str) else None
            if (
                pure is None
                or not path_text
                or path_text in seen
                or pure.is_absolute()
                or "." in pure.parts
                or ".." in pure.parts
                or record.get("mode") not in {"0444", "0555"}
                or not isinstance(record.get("bytes"), int)
                or isinstance(record.get("bytes"), bool)
                or record["bytes"] < 1
                or not isinstance(digest, str)
                or len(digest) != 64
                or any(ch not in "0123456789abcdef" for ch in digest)
            ):
                fail("MANIFEST_FILE_INVALID", str(path_text))
            seen.add(path_text)
        for key in ("release_sha256", "inventory_sha256"):
            digest = value.get(key)
            if not isinstance(digest, str) or len(digest) != 64 or any(ch not in "0123456789abcdef" for ch in digest):
                fail("MANIFEST_DIGEST_INVALID", key)
        if not isinstance(value.get("release_bytes"), int) or not 0 < value["release_bytes"] <= MAX_ARCHIVE_BYTES:
            fail("MANIFEST_RELEASE_BYTES_INVALID")
        expected = sorted(files, key=lambda item: item["path"])
        if hashlib.sha256(_json_bytes(expected)).hexdigest() != value["inventory_sha256"]:
            fail("MANIFEST_INVENTORY_INVALID")
        return value
    
    
    def ensure_user_and_dirs() -> None:
        try:
            account = pwd.getpwnam("aef")
        except KeyError:
            run_exact(
                ("/usr/sbin/useradd", "/sbin/useradd"),
                "--system", "--no-create-home", "--home-dir", "/nonexistent",
                "--shell", "/usr/sbin/nologin", "aef",
            )
            try:
                account = pwd.getpwnam("aef")
            except KeyError:
                fail("AEF_USER_CREATE_FAILED")
        if account.pw_shell not in {"/usr/sbin/nologin", "/sbin/nologin"}:
            fail("AEF_USER_SHELL_DRIFT")
        for raw, mode, owned in (
            ("/opt/aef", 0o755, False),
            (RELEASES_PATH, 0o755, False),
            ("/var/lib/aef", 0o700, True),
            ("/var/lib/aef/staging", 0o700, True),
            ("/var/lib/aef/state", 0o700, True),
            ("/etc/aef", 0o755, False),
        ):
            path = rp(raw)
            if path.is_symlink():
                fail("BOOTSTRAP_PATH_SYMLINK", raw)
            path.mkdir(parents=True, exist_ok=True)
            os.chmod(path, mode)
            if owned:
                os.chown(path, account.pw_uid, account.pw_gid)
    
    
    def ensure_swap() -> None:
        path = rp(SWAP_PATH)
        if path.exists() or path.is_symlink():
            if path.is_symlink() or not path.is_file():
                fail("SWAPFILE_INVALID")
        else:
            if shutil.disk_usage(rp("/")).free < SWAP_BYTES + DISK_HEADROOM_BYTES:
                fail("DISK_HEADROOM_INSUFFICIENT")
            run_exact(("/usr/bin/fallocate", "/bin/fallocate"), "-l", str(SWAP_BYTES), str(path), timeout=60)
            os.chmod(path, 0o600)
            run_exact(("/usr/sbin/mkswap", "/sbin/mkswap"), str(path), timeout=30)
            run_exact(("/usr/sbin/swapon", "/sbin/swapon"), str(path), timeout=30)
        observed = os.lstat(path)
        if (
            not stat.S_ISREG(observed.st_mode)
            or observed.st_size != SWAP_BYTES
            or observed.st_uid != 0
            or stat.S_IMODE(observed.st_mode) != 0o600
        ):
            fail("SWAPFILE_DRIFT")
        if not swap_active():
            fail("SWAP_NOT_ACTIVE")
        fstab = rp("/etc/fstab")
        if fstab.is_symlink() or not fstab.is_file():
            fail("FSTAB_INVALID")
        rows = [
            line.split()
            for line in fstab.read_text(encoding="utf-8").splitlines()
            if line.strip() and not line.lstrip().startswith("#")
        ]
        swap_rows = [row for row in rows if row and row[0] == SWAP_PATH]
        if not swap_rows:
            with fstab.open("a", encoding="utf-8") as handle:
                handle.write("/swapfile none swap sw 0 0\n")
                handle.flush()
                os.fsync(handle.fileno())
        elif len(swap_rows) != 1 or len(swap_rows[0]) < 3 or swap_rows[0][2] != "swap":
            fail("FSTAB_SWAP_DRIFT")
    
    
    def read_archive(manifest: dict) -> bytes:
        path = rp(PAYLOAD_PATH)
        if path.is_symlink() or not path.is_file() or os.lstat(path).st_mode & 0o222:
            fail("PAYLOAD_FILE_INVALID")
        try:
            data = base64.b85decode(path.read_text(encoding="ascii").strip().encode("ascii"))
        except Exception:
            fail("PAYLOAD_DECODE_FAILED")
        if len(data) != manifest["release_bytes"] or hashlib.sha256(data).hexdigest() != manifest["release_sha256"]:
            fail("ARCHIVE_SHA_MISMATCH")
        return data
    
    
    def expected_dirs(files) -> set[str]:
        result = set()
        for record in files:
            parts = PurePosixPath(record["path"]).parts[:-1]
            current = []
            for part in parts:
                current.append(part)
                result.add("/".join(current))
        return result
    
    
    def validate_members(bundle: tarfile.TarFile, manifest: dict) -> None:
        expected = {record["path"]: record for record in manifest["files"]}
        directories = {TOP_LEVEL} | {TOP_LEVEL + "/" + value for value in expected_dirs(manifest["files"])}
        seen = set()
        seen_files = set()
        seen_dirs = set()
        total = 0
        for member in bundle.getmembers():
            raw = PurePosixPath(member.name)
            key = raw.as_posix().rstrip("/")
            if (
                raw.is_absolute()
                or "." in raw.parts
                or ".." in raw.parts
                or not raw.parts
                or raw.parts[0] != TOP_LEVEL
                or any(ord(ch) < 32 for ch in member.name)
            ):
                fail("ARCHIVE_PATH_INVALID", member.name)
            if key in seen:
                fail("ARCHIVE_DUPLICATE", key)
            seen.add(key)
            if member.isdir():
                if key not in directories or stat.S_IMODE(member.mode) != 0o555:
                    fail("ARCHIVE_DIRECTORY_INVALID", key)
                seen_dirs.add(key)
                continue
            if not member.isfile():
                fail("ARCHIVE_MEMBER_INVALID", key)
            rel = PurePosixPath(*raw.parts[1:]).as_posix()
            record = expected.get(rel)
            if (
                record is None
                or member.size != record["bytes"]
                or format(stat.S_IMODE(member.mode), "04o") != record["mode"]
            ):
                fail("ARCHIVE_FILE_METADATA_DRIFT", rel)
            total += member.size
            if total > MAX_ARCHIVE_BYTES:
                fail("ARCHIVE_SIZE_INVALID")
            seen_files.add(rel)
        if seen_files != set(expected) or seen_dirs != directories:
            fail("ARCHIVE_FILESET_MISMATCH")
    
    
    def _directory_set(root: Path) -> set[str]:
        result = set()
        for path in root.rglob("*"):
            observed = os.lstat(path)
            if stat.S_ISDIR(observed.st_mode):
                result.add(path.relative_to(root).as_posix())
        return result
    
    
    def inventory(root: Path, manifest: dict, *, require_frozen_root: bool = True) -> list[dict]:
        root_observed = os.lstat(root)
        if not stat.S_ISDIR(root_observed.st_mode) or root.is_symlink():
            fail("TREE_ROOT_INVALID")
        if require_frozen_root and stat.S_IMODE(root_observed.st_mode) != 0o555:
            fail("TREE_ROOT_MODE_DRIFT")
        records = []
        dirs = set()
        for path in root.rglob("*"):
            rel = path.relative_to(root).as_posix()
            observed = os.lstat(path)
            if stat.S_ISLNK(observed.st_mode):
                fail("TREE_SYMLINK", rel)
            if stat.S_ISDIR(observed.st_mode):
                dirs.add(rel)
                if stat.S_IMODE(observed.st_mode) != 0o555:
                    fail("TREE_DIR_MODE_DRIFT", rel)
                continue
            if not stat.S_ISREG(observed.st_mode):
                fail("TREE_NODE_INVALID", rel)
            if rel == ".aef-release-sha256":
                continue
            data = path.read_bytes()
            records.append(
                {
                    "path": rel,
                    "bytes": len(data),
                    "mode": format(stat.S_IMODE(observed.st_mode), "04o"),
                    "sha256": hashlib.sha256(data).hexdigest(),
                }
            )
        records = sorted(records, key=lambda item: item["path"])
        if records != sorted(manifest["files"], key=lambda item: item["path"]):
            fail("TREE_RECORDS_MISMATCH")
        if dirs != expected_dirs(manifest["files"]):
            fail("TREE_DIRSET_MISMATCH")
        if hashlib.sha256(_json_bytes(records)).hexdigest() != manifest["inventory_sha256"]:
            fail("TREE_DIGEST_MISMATCH")
        return records
    
    
    def extract_release(data: bytes, stage: Path, manifest: dict) -> Path:
        if stage.exists() or stage.is_symlink():
            fail("STAGE_EXISTS")
        stage.mkdir(mode=0o755)
        with tarfile.open(fileobj=io.BytesIO(data), mode="r:gz") as bundle:
            validate_members(bundle, manifest)
            bundle.extractall(stage, filter="data")
        root = stage / TOP_LEVEL
        if root.is_symlink() or not root.is_dir():
            fail("EXTRACT_ROOT_INVALID")
        for record in manifest["files"]:
            path = root.joinpath(*PurePosixPath(record["path"]).parts)
            if path.is_symlink() or not path.is_file():
                fail("EXTRACTED_FILE_INVALID", record["path"])
            content = path.read_bytes()
            if len(content) != record["bytes"] or hashlib.sha256(content).hexdigest() != record["sha256"]:
                fail("EXTRACTED_FILE_CONTENT_DRIFT", record["path"])
            os.chmod(path, int(record["mode"], 8))
        marker = root / ".aef-release-sha256"
        marker.write_text(manifest["release_sha256"] + "\n", encoding="ascii")
        os.chmod(marker, 0o444)
        derived_dirs = expected_dirs(manifest["files"])
        if _directory_set(root) != derived_dirs:
            fail("TREE_DIRSET_MISMATCH")
        for rel in sorted(derived_dirs, key=lambda value: len(PurePosixPath(value).parts), reverse=True):
            path = root.joinpath(*PurePosixPath(rel).parts)
            if path.is_symlink() or not path.is_dir():
                fail("EXTRACTED_DIR_INVALID", rel)
            os.chmod(path, 0o555)
        # Keep only the unpublished staging root root-writable until the atomic rename.
        # All release files and child directories are already immutable and verified.
        os.chmod(root, 0o755)
        inventory(root, manifest, require_frozen_root=False)
        return root
    
    
    def verify_tree(root: Path, manifest: dict) -> None:
        if root.is_symlink() or not root.is_dir():
            fail("TARGET_INVALID")
        if stat.S_IMODE(os.lstat(root).st_mode) != 0o555:
            fail("TARGET_ROOT_MODE_DRIFT")
        marker = root / ".aef-release-sha256"
        if (
            marker.is_symlink()
            or not marker.is_file()
            or marker.read_text(encoding="ascii").strip() != manifest["release_sha256"]
        ):
            fail("MARKER_DRIFT")
        inventory(root, manifest)
    
    
    def _verified_publish_parent(path: Path, code: str) -> None:
        if path.is_symlink() or not path.is_dir():
            fail(code + "_INVALID")
        if stat.S_IMODE(os.lstat(path).st_mode) != 0o755:
            fail(code + "_MODE_DRIFT")
    
    
    def install_release(data: bytes, manifest: dict) -> Path:
        releases = rp(RELEASES_PATH)
        target = releases / manifest["release_sha256"]
        stage = releases / (".stage-" + manifest["release_sha256"])
        _verified_publish_parent(releases, "RELEASES")
        if target.is_symlink():
            fail("TARGET_SYMLINK")
        if target.exists():
            verify_tree(target, manifest)
            return target
        if stage.is_symlink():
            fail("STAGE_SYMLINK")
        if stage.exists():
            if not stage.is_dir():
                fail("STAGE_INVALID")
            shutil.rmtree(stage)
        root = extract_release(data, stage, manifest)
        _verified_publish_parent(stage, "STAGE")
        if stat.S_IMODE(os.lstat(root).st_mode) != 0o755:
            fail("STAGE_ROOT_MODE_DRIFT")
        os.rename(root, target)
        os.chmod(target, 0o555)
        shutil.rmtree(stage)
        verify_tree(target, manifest)
        return target
    
    
    def runtime_smoke(target: Path) -> None:
        modules = [
            "runtime." + path.stem
            for path in sorted((target / "runtime").glob("*.py"))
            if path.name != "__init__.py"
        ]
        code = (
            "import importlib,sys;sys.path.insert(0,"
            + repr(str(target))
            + ");mods="
            + repr(modules)
            + ";[importlib.import_module(name) for name in mods]"
        )
        result = subprocess.run(
            ["/usr/bin/python3", "-I", "-c", code],
            stdin=subprocess.DEVNULL,
            stdout=subprocess.PIPE,
            stderr=subprocess.PIPE,
            text=True,
            timeout=120,
            check=False,
            env={"PATH": "/usr/bin:/bin:/usr/sbin:/sbin", "HOME": "/root"},
        )
        if result.returncode != 0:
            fail("RUNTIME_SMOKE_FAILED", result.stderr.splitlines()[-1] if result.stderr else "")
    
    
    def publish_current(target: Path, manifest: dict) -> None:
        current = rp(CURRENT_PATH)
        if current.is_symlink():
            if current.resolve(strict=True) != target.resolve(strict=True):
                fail("CURRENT_DRIFT")
            return
        if current.exists():
            fail("CURRENT_NOT_SYMLINK")
        tmp = current.with_name(".current-" + manifest["release_sha256"])
        if tmp.exists() or tmp.is_symlink():
            tmp.unlink()
        os.symlink(str(target), tmp)
        os.replace(tmp, current)
    
    
    def main() -> int:
        manifest = None
        try:
            if os.geteuid() != 0:
                fail("ROOT_REQUIRED")
            mark("PRECHECK")
            verify_os()
            manifest = load_manifest()
            ensure_user_and_dirs()
            mark("SWAP", manifest)
            ensure_swap()
            mark("VERIFY_ARCHIVE", manifest)
            data = read_archive(manifest)
            mark("INSTALL_RELEASE", manifest)
            target = install_release(data, manifest)
            mark("RUNTIME_SMOKE", manifest)
            runtime_smoke(target)
            mark("PUBLISH_CURRENT", manifest)
            publish_current(target, manifest)
            verify_tree(target, manifest)
            if service_installed():
                fail("SERVICE_PREMATURELY_INSTALLED")
            global phase
            phase = "READY"
            state("BOOTSTRAP_READY_NOT_ENROLLED", manifest)
            return 0
        except Exception as exc:
            try:
                state("BLOCKED", manifest, type(exc).__name__, str(exc)[:240])
            except Exception:
                pass
            raise
    
    
    if __name__ == "__main__":
        raise SystemExit(main())
- path: /etc/aef/bootstrap-manifest-v3.json
  permissions: '0444'
